# Render Blueprint: portāls + PostgreSQL datubāze vienā klikšķī.
# Maksas plāni (kopā ap 13 $/mēn.): portāls starter (neaizmieg), datubāze basic-256mb (netiek dzēsta).
# Testam var likt "free", bet bezmaksas datubāzi Render izdzēš pēc 30 dienām.
# Render → New → Blueprint → izvēlies repozitoriju kripone/vienavieta.
services:
  - type: web
    name: vienavieta
    runtime: node
    region: frankfurt
    plan: starter # 7 $/mēn., neaizmieg
    buildCommand: npm ci && npm run build
    # Pirms palaišanas: datubāzes migrācijas un vietu/kataloga dati (drīkst atkārtot)
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: vienavieta-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Pēc pirmās palaišanas ieraksti portāla adresi, piem. https://vienavieta.onrender.com
      - key: APP_URL
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      # Galvenais domēns (bez https://), piem. vienavieta.lv. Ja iestatīts, *.onrender.com un www pāradresē uz to (src/proxy.ts).
      - key: CANONICAL_HOST
        sync: false
      # Push paziņojumi (npx web-push generate-vapid-keys)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:info@vienavieta.lv
      # E-pasts: Render bezmaksas plānā SMTP porti bloķēti, tāpēc lieto Brevo API (HTTPS).
      - key: BREVO_API_KEY
        sync: false
      # SMTP tikai maksas plānā vai citā hostingā
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Bildes: Cloudflare R2 ("s3"); bez R2 atslēgām var izmantot "db" (sk. docs/DEPLOY.md)
      # Administratoru e-pasti (komats starp tiem): piekļuve /moderacija
      - key: ADMIN_EMAILS
        sync: false
      # Adrešu ģeokodēšana (Google Geocoding API, servera atslēga bez vietnes ierobežojuma)
      - key: GOOGLE_GEOCODING_KEY
        sync: false
      # Google karte (Map Tiles API), sk. docs/MAPS.md
      - key: NEXT_PUBLIC_GOOGLE_MAPS_KEY
        sync: false
      # Apmeklējumu statistika (Cloudflare Web Analytics, bez sīkdatnēm): vietnes JS fragmenta "token"
      - key: CF_ANALYTICS_TOKEN
        sync: false
      # Ielu skats sludinājuma kartē lapā (Cloud konsolē jāieslēdz "Maps Embed API"); bez tā rāda saiti uz Google Maps
      - key: NEXT_PUBLIC_STREETVIEW_EMBED
        value: "on"
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_PUBLIC_URL
        sync: false

databases:
  - name: vienavieta-db
    region: frankfurt
    plan: basic-1gb # ~19 $/mēn.: 0,5 CPU, 1 GB atmiņa (256mb ar 0,1 CPU bija par lēnu)
    postgresMajorVersion: "16"
    databaseName: vienavieta
    user: vienavieta
