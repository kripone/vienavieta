# Render Blueprint: portāls + PostgreSQL datubāze vienā klikšķī.
# Testam bezmaksas plāni: portāls "aizmieg" pēc 15 min bez apmeklētājiem, bezmaksas datubāze
# Render tiek dzēsta pēc 30 dienām. Pastāvīgai versijai: web plan starter, db basic-256mb.
# Render → New → Blueprint → izvēlies repozitoriju kripone/vienavieta.
services:
  - type: web
    name: vienavieta
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    # Pirms palaišanas: datubāzes migrācijas un vietu/kataloga dati (drīkst atkārtot)
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: vienavieta-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Pēc pirmās palaišanas ieraksti portāla adresi, piem. https://vienavieta.onrender.com
      - key: APP_URL
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      # E-pasts (Brevo vai cits SMTP), sk. docs/AUTH-SETUP.md
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Bildes: testam datubāzē ("db"); kad ir R2 atslēgas, nomaini uz "s3" (sk. docs/DEPLOY.md)
      - key: STORAGE_DRIVER
        value: db
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_PUBLIC_URL
        sync: false

databases:
  - name: vienavieta-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"
    databaseName: vienavieta
    user: vienavieta
