# Lokālā izstrāde: PostgreSQL datubāze
# Palaišana: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vienavieta
      POSTGRES_PASSWORD: vienavieta
      POSTGRES_DB: vienavieta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vienavieta"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
